<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Invitation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            text-align: center;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 40px;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
            z-index: 2;
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            color: #e91e63;
        }

        p {
            color: #333;
            font-size: 1.1em;
        }

        .heart {
            font-size: 3em;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        button {
            background: #e91e63;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            transition: 0.3s;
        }

        button:hover {
            background: #c2185b;
        }

        #no-btn {
            background: #777;
        }

        #invitation, #choices, #confirmation {
            display: none;
            margin-top: 20px;
        }

        #confirmation {
            color: #e91e63;
            font-weight: bold;
            font-size: 1.2em;
        }

        .hearts-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .heart-bg {
            position: absolute;
            font-size: 2em;
            animation: float 6s linear infinite;
            opacity: 0.6;
        }

        @keyframes float {
            from { transform: translateY(100vh); }
            to { transform: translateY(-100vh); }
        }
    </style>
</head>

<body>
    <div class="hearts-bg" id="hearts-bg"></div>

    <div class="card">
        <div class="heart">❤️</div>
        <h1>Happy Valentine’s Day!</h1>
        <p>I made something special just for you 💕</p>

        <button onclick="revealInvitation(this)">Reveal Invitation</button>

        <div id="invitation">
            <p>
                Will you be my Valentine?  
                Let’s have a romantic date together 💖
            </p>
            <p>— Yours truly</p>
        </div>

        <div id="choices">
            <button id="yes-btn" onclick="sayYes()">Yes</button>
            <button id="no-btn" onclick="sayNo()">No</button>
        </div>

        <div id="confirmation">
            Yay! I can’t wait for our date ❤️
        </div>
    </div>

    <script>
        // Floating hearts
        function createHeart() {
            const heart = document.createElement("div");
            heart.className = "heart-bg";
            heart.innerText = "❤️";
            heart.style.left = Math.random() * 100 + "%";
            document.getElementById("hearts-bg").appendChild(heart);

            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 500);

        // Reveal invitation
        function revealInvitation(btn) {
            document.getElementById("invitation").style.display = "block";
            document.getElementById("choices").style.display = "block";
            btn.style.display = "none";
        }

        // Yes / No logic
        let scale = 1;
        function sayNo() {
            scale += 0.2;
            document.getElementById("yes-btn").style.transform = `scale(${scale})`;
        }

        function sayYes() {
            document.getElementById("choices").style.display = "none";
            document.getElementById("confirmation").style.display = "block";
        }
    </script>
</body>
</html>
